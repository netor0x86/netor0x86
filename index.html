<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页 · 作品与文章</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f9fafb;
            --text: #1e293b;
            --text-strong: #0f172a;
            --text-muted: #64748b;
            --text-faint: #94a3b8;
            --card-bg: #ffffff;
            --card-border: #f0f2f5;
            --divider: #e2e8f0;
            --divider-light: #f1f5f9;
            --divider-faint: #f8fafc;
            --badge-bg: #f1f5f9;
            --badge-text: #64748b;
            --hover-blue: #2563eb;
            --tag-bg: #eef2ff;
            --tag-text: #4f46e5;
            --column-bg: #ecfdf5;
            --column-text: #059669;
            --input-bg: #ffffff;
            --input-border: #e2e8f0;
            --nav-bg: rgba(249, 250, 251, 0.85);
            --nav-active-bg: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.03);
            --shadow-hover: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-project-hover: 0 6px 16px rgba(0,0,0,0.05);
            --shadow-nav: 0 1px 3px rgba(0,0,0,0.04);
        }

        html.dark {
            --bg: #0f172a;
            --text: #cbd5e1;
            --text-strong: #f1f5f9;
            --text-muted: #94a3b8;
            --text-faint: #64748b;
            --card-bg: #1e293b;
            --card-border: #334155;
            --divider: #334155;
            --divider-light: #334155;
            --divider-faint: #1e293b;
            --badge-bg: #334155;
            --badge-text: #cbd5e1;
            --hover-blue: #60a5fa;
            --tag-bg: #312e81;
            --tag-text: #a5b4fc;
            --column-bg: #064e3b;
            --column-text: #6ee7b7;
            --input-bg: #1e293b;
            --input-border: #334155;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --nav-active-bg: #334155;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-hover: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-project-hover: 0 6px 16px rgba(0,0,0,0.5);
            --shadow-nav: 0 1px 3px rgba(0,0,0,0.4);
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }

        body {
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            color: var(--text);
            line-height: 1.5;
            padding: 0;
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .topnav {
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: saturate(180%) blur(12px);
            -webkit-backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid var(--divider);
            box-shadow: var(--shadow-nav);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .topnav-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0.6rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .topnav-brand {
            font-size: 0.9rem;
            font-weight: 550;
            color: var(--text-strong);
            margin-right: 0.5rem;
            white-space: nowrap;
        }

        .topnav-links {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
            flex: 1;
        }

        .topnav-link {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.82rem;
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            transition: all 0.15s ease;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .topnav-link:hover {
            color: var(--hover-blue);
            background: var(--badge-bg);
        }

        .topnav-link.is-active {
            color: var(--hover-blue);
            background: var(--nav-active-bg);
            border-color: var(--divider);
        }

        .topnav-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: auto;
        }

        .theme-toggle {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .theme-toggle:hover {
            transform: scale(1.08);
            box-shadow: var(--shadow-hover);
        }

        .index-container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem 2.5rem 1.5rem;
        }

        .page-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--divider);
        }

        .page-header-text h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--text-strong);
        }

        .page-header-text p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
        }

        .search-bar {
            margin-bottom: 2.5rem;
            position: relative;
        }

        .search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            color: var(--text-faint);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 2.75rem 0.75rem 2.5rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text);
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input::placeholder {
            color: var(--text-faint);
        }

        .search-input:focus {
            border-color: var(--hover-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-clear {
            position: absolute;
            right: 0.75rem;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: var(--badge-bg);
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .search-clear:hover {
            background: var(--divider);
            color: var(--text);
        }

        .search-clear.is-visible {
            display: flex;
        }

        .search-hint {
            margin-top: 0.6rem;
            font-size: 0.8rem;
            color: var(--text-faint);
            padding-left: 0.25rem;
        }

        .search-hint .keyword {
            color: var(--hover-blue);
            font-weight: 500;
        }

        .no-results {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-faint);
            font-size: 0.95rem;
            display: none;
        }

        .no-results.is-visible {
            display: block;
        }

        .block {
            margin-bottom: 3.5rem;
            scroll-margin-top: 76px;
        }

        .block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--divider);
        }

        .block-header-left {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            flex-wrap: wrap;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.15s ease;
            flex: 1;
        }

        .block-header-left:hover {
            opacity: 0.85;
        }

        .block-header h2 {
            font-size: 1.4rem;
            font-weight: 550;
            color: var(--text-strong);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .block-header .block-sub {
            font-size: 0.85rem;
            color: var(--text-faint);
        }

        .block-header-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .block-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.78rem;
            font-family: inherit;
            color: var(--text-muted);
            background: var(--badge-bg);
            border: 1px solid var(--divider-light);
            border-radius: 20px;
            padding: 0.2rem 0.7rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .block-toggle:hover {
            color: var(--hover-blue);
            border-color: var(--divider);
            background: var(--divider-faint);
        }

        .block-toggle .arrow {
            display: inline-block;
            font-size: 0.65rem;
            transition: transform 0.2s ease;
        }

        .block-toggle[data-expanded="false"] .arrow {
            transform: rotate(-90deg);
        }

        .back-top {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            font-size: 0.78rem;
            font-family: inherit;
            color: var(--text-muted);
            background: var(--badge-bg);
            border: 1px solid var(--divider-light);
            border-radius: 20px;
            padding: 0.2rem 0.7rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .back-top:hover {
            color: var(--hover-blue);
            border-color: var(--divider);
            background: var(--divider-faint);
        }

        .back-top .arrow {
            font-size: 0.7rem;
        }

        .block.is-collapsed .block-body {
            display: none;
        }

        .block.is-collapsed {
            margin-bottom: 1.5rem;
        }

        .block.is-collapsed .block-header {
            margin-bottom: 0;
            padding-bottom: 0.6rem;
        }

        .section {
            margin-bottom: 2.5rem;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text);
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--divider);
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.15s ease;
        }

        .section-title:hover {
            opacity: 0.85;
        }

        .section-title-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }

        .section-title .count-badge {
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--text-faint);
            background: var(--badge-bg);
            padding: 0.15rem 0.6rem;
            border-radius: 20px;
            text-transform: none;
            letter-spacing: 0;
        }

        .section-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.75rem;
            font-family: inherit;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid var(--divider-light);
            border-radius: 20px;
            padding: 0.15rem 0.6rem;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .section-toggle:hover {
            color: var(--hover-blue);
            border-color: var(--divider);
            background: var(--divider-faint);
        }

        .section-toggle .arrow {
            display: inline-block;
            font-size: 0.6rem;
            transition: transform 0.2s ease;
        }

        .section-toggle[data-expanded="false"] .arrow {
            transform: rotate(-90deg);
        }

        .section.is-collapsed {
            margin-bottom: 1.25rem;
        }

        .section.is-collapsed .section-body {
            display: none;
        }

        .section.is-collapsed .section-title {
            margin-bottom: 0;
            padding-bottom: 0.6rem;
        }

        .section.is-empty {
            display: none;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .project-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 1.25rem 1.25rem 1.1rem 1.25rem;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.15s ease, transform 0.15s ease, background-color 0.25s ease, border-color 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            text-decoration: none;
            color: inherit;
        }

        .project-card:hover {
            box-shadow: var(--shadow-project-hover);
            transform: translateY(-2px);
        }

        .project-card.is-hidden {
            display: none;
        }

        .project-name {
            font-size: 1rem;
            font-weight: 550;
            color: var(--text-strong);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .project-name .gh-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            fill: var(--text-muted);
        }

        .project-card:hover .project-name {
            color: var(--hover-blue);
        }

        .project-card:hover .project-name .gh-icon {
            fill: var(--hover-blue);
        }

        .project-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            flex: 1;
        }

        .project-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.15rem;
        }

        .project-lang {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.75rem;
            color: var(--text);
        }

        .project-lang .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-faint);
            flex-shrink: 0;
        }

        .project-stars {
            font-size: 0.75rem;
            color: var(--text-faint);
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .masonry {
            position: relative;
            width: 100%;
        }

        .masonry > .list-card,
        .masonry > .month-card,
        .masonry > .tag-card,
        .masonry > .column-card {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .masonry.is-ready > .list-card,
        .masonry.is-ready > .month-card,
        .masonry.is-ready > .tag-card,
        .masonry.is-ready > .column-card {
            opacity: 1;
        }

        .list-card.is-hidden,
        .month-card.is-hidden,
        .tag-card.is-hidden,
        .column-card.is-hidden {
            display: none;
        }

        .list-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 1.25rem 1.25rem 1rem 1.25rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--card-border);
            transition: box-shadow 0.15s ease, background-color 0.25s ease, border-color 0.25s ease;
        }

        .list-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .list-card-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 0.9rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--divider-light);
        }

        .list-card-header h3 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .list-card-header .badge {
            font-size: 0.7rem;
            color: var(--badge-text);
            background: var(--badge-bg);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            font-weight: 400;
        }

        .tag-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 1.25rem 1.25rem 1rem 1.25rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--card-border);
            transition: box-shadow 0.15s ease, background-color 0.25s ease, border-color 0.25s ease;
        }

        .tag-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .tag-card-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 0.9rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--divider-light);
        }

        .tag-card-header h3 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .tag-pill {
            display: inline-flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--tag-text);
            background: var(--tag-bg);
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            letter-spacing: 0.01em;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .tag-pill::before {
            content: "#";
            margin-right: 1px;
            opacity: 0.7;
        }

        .tag-card-header .badge {
            font-size: 0.7rem;
            color: var(--badge-text);
            background: var(--badge-bg);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            font-weight: 400;
        }

        .column-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 1.25rem 1.25rem 1rem 1.25rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--card-border);
            transition: box-shadow 0.15s ease, background-color 0.25s ease, border-color 0.25s ease;
        }

        .column-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .column-card-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 0.9rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--divider-light);
        }

        .column-card-header h3 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .column-pill {
            display: inline-flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--column-text);
            background: var(--column-bg);
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            letter-spacing: 0.01em;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .column-pill::before {
            content: "📖";
            margin-right: 0.25rem;
            font-size: 0.75rem;
        }

        .column-card-header .badge {
            font-size: 0.7rem;
            color: var(--badge-text);
            background: var(--badge-bg);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            font-weight: 400;
        }

        .article-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .article-item {
            padding: 0.45rem 0;
            border-bottom: 1px solid var(--divider-faint);
        }

        .article-item:last-child {
            border-bottom: none;
        }

        .article-item a {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text);
            font-size: 0.9rem;
            transition: color 0.15s;
            gap: 0.75rem;
        }

        .article-item a:hover {
            color: var(--hover-blue);
        }

        .article-item a:hover .article-title {
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
        }

        .article-title {
            font-weight: 450;
            word-break: break-word;
            line-height: 1.4;
        }

        .article-meta {
            font-size: 0.7rem;
            color: var(--text-faint);
            white-space: nowrap;
            flex-shrink: 0;
            background: var(--badge-bg);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
        }

        .toggle-btn {
            display: block;
            width: 100%;
            margin-top: 0.6rem;
            padding: 0.45rem 0;
            font-size: 0.78rem;
            font-family: inherit;
            color: var(--text-muted);
            background: var(--divider-faint);
            border: 1px solid var(--divider-light);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }

        .toggle-btn:hover {
            background: var(--badge-bg);
            color: var(--hover-blue);
            border-color: var(--divider);
        }

        .toggle-btn .arrow {
            display: inline-block;
            margin-left: 0.25rem;
            transition: transform 0.15s ease;
            font-size: 0.7rem;
        }

        .article-item.is-hidden {
            display: none;
        }

        .article-item.is-filtered {
            display: none;
        }

        .year-block {
            margin-bottom: 2rem;
        }

        .year-label {
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--text-strong);
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .year-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--divider);
        }

        .year-block.is-empty {
            display: none;
        }

        .month-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1rem 1rem 0.75rem 1rem;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.15s ease, background-color 0.25s ease, border-color 0.25s ease;
        }

        .month-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .month-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 0.65rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--divider-light);
        }

        .month-header h4 {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
        }

        .month-header .count {
            font-size: 0.7rem;
            color: var(--text-faint);
            background: var(--badge-bg);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
        }

        .empty-note {
            padding: 0.75rem 0;
            color: var(--text-faint);
            font-size: 0.85rem;
            font-style: italic;
        }

        .footer {
            margin-top: 3rem;
            border-top: 1px solid var(--divider);
            padding-top: 1.25rem;
            font-size: 0.8rem;
            color: var(--text-faint);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .block.is-hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .index-container {
                padding: 1.5rem 1rem 2rem 1rem;
            }

            .topnav-inner {
                padding: 0.5rem 1rem;
                gap: 0.3rem;
            }

            .topnav-brand {
                display: none;
            }

            .topnav-link {
                font-size: 0.78rem;
                padding: 0.3rem 0.6rem;
            }

            .page-header-text h1 {
                font-size: 1.7rem;
            }

            .block-header h2 {
                font-size: 1.2rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .article-item a {
                flex-wrap: wrap;
                gap: 0.25rem;
            }

            .article-meta {
                white-space: normal;
                background: transparent;
                padding-left: 0;
            }

            .back-top .label {
                display: none;
            }

            .section-toggle .label {
                display: none;
            }
        }
    </style>
</head>
<body>

        <div class="topnav-inner">

        <!-- ========== 公众号文章 ========== -->
        <section class="block" id="block-articles" data-block-key="articles">
            <div class="block-header">

                    <span class="block-sub" id="article-count-badge"></span>

                <div class="block-header-actions">
                    <a class="back-top" href="#" data-back-top title="回到顶部">

                    <button class="block-toggle" type="button" data-toggle-block="block-articles" data-expanded="true" aria-label="折叠/展开">

            <span>持续更新中</span>

    </div>

    <script src="data.js"></script>
    <script>
        const MONTH_NAMES = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

        function parseDate(str) {
            const [y, m, d] = str.split('-').map(Number);
            return { year: y, month: m, day: d };
        }

        function shortDate(str) {
            const { month, day } = parseDate(str);
            return String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function makeItemId(groupKey, item) {
            return groupKey + '||' + item.date + '|' + item.title;
        }

        function buildListHtml(groupKey, list, cardId) {
            const needCollapse = list.length > COLLAPSE_THRESHOLD;

            const itemsHtml = list.map((item, index) => {
                const hiddenClass = (needCollapse && index >= COLLAPSE_THRESHOLD) ? ' is-hidden' : '';
                const iid = makeItemId(groupKey, item);
                return `
                    <li class="article-item${hiddenClass}" data-card="${cardId}" data-iid="${escapeHtml(iid)}">
                        <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
                            <span class="article-title">${escapeHtml(item.title)}</span>
                            <span class="article-meta">${shortDate(item.date)}</span>
                        </a>
                    </li>
                `;
            }).join('');

            let toggleHtml = '';
            if (needCollapse) {
                toggleHtml = `
                    <button class="toggle-btn" data-card="${cardId}" data-expanded="false">
                        展开全部 ${list.length} 篇 <span class="arrow">▾</span>
                    </button>
                `;
            }

            return { itemsHtml, toggleHtml };
        }

        function renderProjects() {
            const container = document.getElementById('projects-container');
            if (!container) return;

            if (projects.length === 0) {
                container.innerHTML = '<div class="empty-note">暂无作品，敬请期待。</div>';
                document.getElementById('project-count-badge').textContent = '0 个作品';
                return;
            }

            const ghIconSvg = `
                <svg class="gh-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                </svg>
            `;

            let html = '';
            projects.forEach(p => {
                const lang = p.lang || '';
                const langColor = p.langColor || '#94a3b8';
                const stars = (typeof p.stars === 'number') ? p.stars : null;

                const langHtml = lang
                    ? `<span class="project-lang"><span class="dot" style="background:${langColor}"></span>${escapeHtml(lang)}</span>`
                    : `<span></span>`;

                const starsHtml = (stars !== null)
                    ? `<span class="project-stars">★ ${stars}</span>`
                    : `<span></span>`;

                const searchText = (p.name + ' ' + p.desc + ' ' + (p.lang || '')).toLowerCase();

                html += `
                    <a class="project-card" href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer" data-search="${escapeHtml(searchText)}">
                        <div class="project-name">${ghIconSvg}<span>${escapeHtml(p.name)}</span></div>
                        <div class="project-desc">${escapeHtml(p.desc)}</div>
                        <div class="project-footer">${langHtml}${starsHtml}</div>
                    </a>
                `;
            });

            container.innerHTML = html;
            document.getElementById('project-count-badge').textContent = projects.length + ' 个开源项目';
        }

        function renderContentBlock(groupKey, items, categoryMeta, bodyEl) {
            if (!bodyEl) return;

            bodyEl.innerHTML = `
                <div class="section" id="section-category-${groupKey}" data-section-key="${groupKey}-category">
                    <div class="section-title" data-toggle-section="section-category-${groupKey}">
                        <div class="section-title-left">
                            <span>🏷️ 按类型</span>
                            <span class="count-badge" id="category-count-badge-${groupKey}"></span>
                        </div>
                        <button class="section-toggle" type="button" data-toggle-section="section-category-${groupKey}" data-expanded="true" aria-label="折叠/展开">
                            <span class="label">收起</span>
                            <span class="arrow">▾</span>
                        </button>
                    </div>
                    <div class="section-body">
                        <div class="masonry" id="masonry-category-${groupKey}"></div>
                    </div>
                </div>

                <div class="section" id="section-column-${groupKey}" data-section-key="${groupKey}-column">
                    <div class="section-title" data-toggle-section="section-column-${groupKey}">
                        <div class="section-title-left">
                            <span>📖 按专栏</span>
                            <span class="count-badge" id="column-count-badge-${groupKey}"></span>
                        </div>
                        <button class="section-toggle" type="button" data-toggle-section="section-column-${groupKey}" data-expanded="true" aria-label="折叠/展开">
                            <span class="label">收起</span>
                            <span class="arrow">▾</span>
                        </button>
                    </div>
                    <div class="section-body">
                        <div class="masonry" id="masonry-column-${groupKey}"></div>
                        <div class="empty-note" style="margin-top: 1.5rem; font-size: 0.8rem; font-style: normal; color: #94a3b8;">
                            ⚡ 专栏是系列内容的聚合，一项可属于多个专栏
                        </div>
                    </div>
                </div>

                <div class="section" id="section-tag-${groupKey}" data-section-key="${groupKey}-tag">
                    <div class="section-title" data-toggle-section="section-tag-${groupKey}">
                        <div class="section-title-left">
                            <span>🔖 按标签</span>
                            <span class="count-badge" id="tag-count-badge-${groupKey}"></span>
                        </div>
                        <button class="section-toggle" type="button" data-toggle-section="section-tag-${groupKey}" data-expanded="true" aria-label="折叠/展开">
                            <span class="label">收起</span>
                            <span class="arrow">▾</span>
                        </button>
                    </div>
                    <div class="section-body">
                        <div class="masonry" id="masonry-tag-${groupKey}"></div>
                    </div>
                </div>

                <div class="section" id="section-timeline-${groupKey}" data-section-key="${groupKey}-timeline">
                    <div class="section-title" data-toggle-section="section-timeline-${groupKey}">
                        <div class="section-title-left">
                            <span>🕒 按时间</span>
                            <span class="count-badge">最新优先</span>
                        </div>
                        <button class="section-toggle" type="button" data-toggle-section="section-timeline-${groupKey}" data-expanded="true" aria-label="折叠/展开">
                            <span class="label">收起</span>
                            <span class="arrow">▾</span>
                        </button>
                    </div>
                    <div class="section-body">
                        <div id="timeline-container-${groupKey}"></div>
                    </div>
                </div>

                <div class="no-results" id="no-results-${groupKey}">
                    没有找到相关内容，试试其他关键词吧 🔍
                </div>
            `;

            (function renderCategory() {
                const container = document.getElementById('masonry-category-' + groupKey);
                const grouped = {};
                Object.keys(categoryMeta).forEach(key => grouped[key] = []);
                items.forEach(a => {
                    if (grouped[a.category]) grouped[a.category].push(a);
                });
                Object.keys(grouped).forEach(key => {
                    grouped[key].sort((a, b) => b.date.localeCompare(a.date));
                });

                let html = '';
                let totalCategories = 0;
                Object.keys(categoryMeta).forEach(key => {
                    const list = grouped[key];
                    if (list.length === 0) return;
                    totalCategories++;

                    const meta = categoryMeta[key];
                    const cardId = `${groupKey}-cat-${key}`;
                    const { itemsHtml, toggleHtml } = buildListHtml(groupKey, list, cardId);

                    const searchParts = [meta.name.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '')];
                    list.forEach(a => {
                        searchParts.push(a.title);
                        (a.tags || []).forEach(t => searchParts.push(t));
                        (a.columns || []).forEach(c => searchParts.push(c));
                    });
                    const searchText = searchParts.join(' ').toLowerCase();

                    html += `
                        <div class="list-card" data-search="${escapeHtml(searchText)}">
                            <div class="list-card-header">
                                <h3>${meta.name}</h3>
                                <span class="badge">${list.length} 篇</span>
                            </div>
                            <ul class="article-list">${itemsHtml}</ul>
                            ${toggleHtml}
                        </div>
                    `;
                });

                container.innerHTML = html;
                document.getElementById('category-count-badge-' + groupKey).textContent = totalCategories + ' 个分类';
            })();

            (function renderColumn() {
                const container = document.getElementById('masonry-column-' + groupKey);
                const columnMap = {};
                items.forEach(a => {
                    if (!Array.isArray(a.columns)) return;
                    a.columns.forEach(col => {
                        if (!columnMap[col]) columnMap[col] = [];
                        columnMap[col].push(a);
                    });
                });

                const columnList = Object.keys(columnMap).sort((a, b) => columnMap[b].length - columnMap[a].length);

                if (columnList.length === 0) {
                    container.innerHTML = '<div class="empty-note">暂无专栏。</div>';
                    document.getElementById('column-count-badge-' + groupKey).textContent = '0 个专栏';
                    return;
                }

                let html = '';
                columnList.forEach(col => {
                    const list = columnMap[col].slice().sort((a, b) => b.date.localeCompare(a.date));
                    const cardId = `${groupKey}-col-${encodeURIComponent(col)}`;
                    const { itemsHtml, toggleHtml } = buildListHtml(groupKey, list, cardId);

                    const searchParts = [col];
                    list.forEach(a => {
                        searchParts.push(a.title);
                        (a.tags || []).forEach(t => searchParts.push(t));
                    });
                    const searchText = searchParts.join(' ').toLowerCase();

                    html += `
                        <div class="column-card" data-search="${escapeHtml(searchText)}">
                            <div class="column-card-header">
                                <h3><span class="column-pill">${escapeHtml(col)}</span></h3>
                                <span class="badge">${list.length} 篇</span>
                            </div>
                            <ul class="article-list">${itemsHtml}</ul>
                            ${toggleHtml}
                        </div>
                    `;
                });

                container.innerHTML = html;
                document.getElementById('column-count-badge-' + groupKey).textContent = columnList.length + ' 个专栏';
            })();

            (function renderTag() {
                const container = document.getElementById('masonry-tag-' + groupKey);
                const tagMap = {};
                items.forEach(a => {
                    if (!Array.isArray(a.tags)) return;
                    a.tags.forEach(tag => {
                        if (!tagMap[tag]) tagMap[tag] = [];
                        tagMap[tag].push(a);
                    });
                });

                const tagList = Object.keys(tagMap).sort((a, b) => tagMap[b].length - tagMap[a].length);

                if (tagList.length === 0) {
                    container.innerHTML = '<div class="empty-note">暂无标签。</div>';
                    document.getElementById('tag-count-badge-' + groupKey).textContent = '0 个标签';
                    return;
                }

                let html = '';
                tagList.forEach(tag => {
                    const list = tagMap[tag].slice().sort((a, b) => b.date.localeCompare(a.date));
                    const cardId = `${groupKey}-tag-${encodeURIComponent(tag)}`;
                    const { itemsHtml, toggleHtml } = buildListHtml(groupKey, list, cardId);

                    const searchParts = [tag];
                    list.forEach(a => {
                        searchParts.push(a.title);
                        (a.tags || []).forEach(t => searchParts.push(t));
                        (a.columns || []).forEach(c => searchParts.push(c));
                    });
                    const searchText = searchParts.join(' ').toLowerCase();

                    html += `
                        <div class="tag-card" data-search="${escapeHtml(searchText)}">
                            <div class="tag-card-header">
                                <h3><span class="tag-pill">${escapeHtml(tag)}</span></h3>
                                <span class="badge">${list.length} 篇</span>
                            </div>
                            <ul class="article-list">${itemsHtml}</ul>
                            ${toggleHtml}
                        </div>
                    `;
                });

                container.innerHTML = html;
                document.getElementById('tag-count-badge-' + groupKey).textContent = tagList.length + ' 个标签';
            })();

            (function renderTimeline() {
                const container = document.getElementById('timeline-container-' + groupKey);

                const byYear = {};
                items.forEach(a => {
                    const { year, month } = parseDate(a.date);
                    if (!byYear[year]) byYear[year] = {};
                    if (!byYear[year][month]) byYear[year][month] = [];
                    byYear[year][month].push(a);
                });

                const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

                let html = '';
                years.forEach(year => {
                    const months = byYear[year];
                    const monthKeys = Object.keys(months).map(Number).sort((a, b) => b - a);

                    let monthCardsHtml = '';
                    monthKeys.forEach(m => {
                        const list = months[m].slice().sort((a, b) => b.date.localeCompare(a.date));
                        const cardId = `${groupKey}-month-${year}-${m}`;
                        const { itemsHtml, toggleHtml } = buildListHtml(groupKey, list, cardId);

                        const searchParts = [year + '年' + MONTH_NAMES[m - 1]];
                        list.forEach(a => searchParts.push(a.title));
                        const searchText = searchParts.join(' ').toLowerCase();

                        monthCardsHtml += `
                            <div class="month-card" data-search="${escapeHtml(searchText)}">
                                <div class="month-header">
                                    <h4>${MONTH_NAMES[m - 1]}</h4>
                                    <span class="count">${list.length} 篇</span>
                                </div>
                                <ul class="article-list">${itemsHtml}</ul>
                                ${toggleHtml}
                            </div>
                        `;
                    });

                    html += `
                        <div class="year-block" data-year="${year}">
                            <div class="year-label">${year}</div>
                            <div class="masonry" id="masonry-${groupKey}-${year}">${monthCardsHtml}</div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            })();
        }

        function renderCounts() {
            document.getElementById('article-count-badge').textContent = articles.length + ' 篇文章';
            document.getElementById('bilibili-count-badge').textContent = bilibiliVideos.length + ' 个视频';
            document.getElementById('footer-count').textContent =
                '共 ' + articles.length + ' 篇文章 · '
                + bilibiliVideos.length + ' 个视频 · '
                + projects.length + ' 个开源作品';
        }

        function layoutMasonry(container, gap) {
            if (!container) return;
            const items = Array.from(container.children).filter(el => {
                if (el.nodeType !== 1) return false;
                if (el.classList.contains('is-hidden')) return false;
                return true;
            });
            if (items.length === 0) {
                container.style.height = '0px';
                container.classList.add('is-ready');
                return;
            }

            items.forEach(item => {
                item.style.position = 'absolute';
                item.style.top = '0';
                item.style.left = '0';
                item.style.width = '';
            });

            const containerWidth = container.clientWidth;

            let columns = 3;
            if (containerWidth < 600) columns = 1;
            else if (containerWidth < 900) columns = 2;

            const totalGap = gap * (columns - 1);
            const columnWidth = (containerWidth - totalGap) / columns;

            items.forEach(item => {
                item.style.width = columnWidth + 'px';
            });

            const columnHeights = new Array(columns).fill(0);

            items.forEach(item => {
                let shortestIndex = 0;
                let shortestHeight = columnHeights[0];
                for (let i = 1; i < columns; i++) {
                    if (columnHeights[i] < shortestHeight) {
                        shortestHeight = columnHeights[i];
                        shortestIndex = i;
                    }
                }

                const left = shortestIndex * (columnWidth + gap);
                const top = columnHeights[shortestIndex];

                item.style.left = left + 'px';
                item.style.top = top + 'px';

                columnHeights[shortestIndex] += item.offsetHeight + gap;
            });

            const maxHeight = Math.max(...columnHeights);
            container.style.height = (maxHeight - gap) + 'px';
            container.classList.add('is-ready');
        }

        function initAllMasonry() {
            const containers = document.querySelectorAll('.masonry');
            containers.forEach(container => {
                const parentBlock = container.closest('.block');
                if (parentBlock && parentBlock.classList.contains('is-collapsed')) {
                    return;
                }
                const parentSection = container.closest('.section');
                if (parentSection && parentSection.classList.contains('is-collapsed')) {
                    return;
                }
                container.classList.remove('is-ready');
                requestAnimationFrame(() => {
                    layoutMasonry(container, 24);
                });
            });
        }

        function initToggle() {
            document.addEventListener('click', function (e) {
                const btn = e.target.closest('.toggle-btn');
                if (!btn) return;

                const cardId = btn.dataset.card;
                const expanded = btn.dataset.expanded === 'true';
                const nextExpanded = !expanded;

                const safeCardId = (window.CSS && CSS.escape) ? CSS.escape(cardId) : cardId;
                const allItems = document.querySelectorAll(`.article-item[data-card="${safeCardId}"]`);

                allItems.forEach((item, index) => {
                    if (index < COLLAPSE_THRESHOLD) return;
                    if (nextExpanded) {
                        item.classList.remove('is-hidden');
                    } else {
                        item.classList.add('is-hidden');
                    }
                });

                btn.dataset.expanded = String(nextExpanded);
                const totalCount = allItems.length;
                if (nextExpanded) {
                    btn.innerHTML = `收起 <span class="arrow" style="transform: rotate(180deg)">▾</span>`;
                } else {
                    btn.innerHTML = `展开全部 ${totalCount} 篇 <span class="arrow">▾</span>`;
                }

                requestAnimationFrame(() => {
                    initAllMasonry();
                });
            });
        }

        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSet(key, val) {
            try { localStorage.setItem(key, val); } catch (e) { /* 忽略 */ }
        }

        /* ========== 大区块折叠 ========== */
        function applyBlockState(blockEl, expanded) {
            const toggleBtn = blockEl.querySelector('.block-toggle');
            if (expanded) {
                blockEl.classList.remove('is-collapsed');
                if (toggleBtn) {
                    toggleBtn.dataset.expanded = 'true';
                    toggleBtn.querySelector('.label').textContent = '收起';
                }
            } else {
                blockEl.classList.add('is-collapsed');
                if (toggleBtn) {
                    toggleBtn.dataset.expanded = 'false';
                    toggleBtn.querySelector('.label').textContent = '展开';
                }
            }
        }

        function initBlockCollapse() {
            document.querySelectorAll('.block[data-block-key]').forEach(blockEl => {
                const key = blockEl.dataset.blockKey;
                const saved = safeGet('block-' + key);
                const expanded = saved === 'collapsed' ? false : true;
                applyBlockState(blockEl, expanded);
            });

            document.addEventListener('click', function (e) {
                if (e.target.closest('[data-back-top]')) return;

                const trigger = e.target.closest('[data-toggle-block]');
                if (!trigger) return;

                const blockEl = document.getElementById(trigger.dataset.toggleBlock);
                if (!blockEl) return;

                const isCollapsed = blockEl.classList.contains('is-collapsed');
                const nextExpanded = isCollapsed;

                applyBlockState(blockEl, nextExpanded);
                safeSet('block-' + blockEl.dataset.blockKey, nextExpanded ? 'expanded' : 'collapsed');

                if (nextExpanded) {
                    requestAnimationFrame(() => {
                        initAllMasonry();
                    });
                }
            });
        }

        /* ========== 子区块（section）折叠 ========== */
        function applySectionState(sectionEl, expanded) {
            const toggleBtn = sectionEl.querySelector('.section-toggle');
            if (expanded) {
                sectionEl.classList.remove('is-collapsed');
                if (toggleBtn) {
                    toggleBtn.dataset.expanded = 'true';
                    toggleBtn.querySelector('.label').textContent = '收起';
                }
            } else {
                sectionEl.classList.add('is-collapsed');
                if (toggleBtn) {
                    toggleBtn.dataset.expanded = 'false';
                    toggleBtn.querySelector('.label').textContent = '展开';
                }
            }
        }

        function initSectionCollapse() {
            // 初始化时读取每个 section 的保存状态
            // 如果 localStorage 里没有保存过，则使用默认值：
            //   - 按时间（*-timeline）默认展开
            //   - 按类型 / 按专栏 / 按标签 默认收起
            document.querySelectorAll('.section[data-section-key]').forEach(sectionEl => {
                const key = sectionEl.dataset.sectionKey;
                const saved = safeGet('section-' + key);

                let expanded;
                if (saved === 'collapsed') {
                    expanded = false;
                } else if (saved === 'expanded') {
                    expanded = true;
                } else {
                    // 没有保存过 → 使用默认值
                    // 只有 timeline 结尾的默认展开，其余默认收起
                    expanded = key.endsWith('-timeline');
                }

                applySectionState(sectionEl, expanded);
            });

            // 事件委托：点击标题栏任意位置（或折叠按钮）切换
            document.addEventListener('click', function (e) {
                if (e.target.closest('[data-back-top]')) return;

                const trigger = e.target.closest('[data-toggle-section]');
                if (!trigger) return;

                const sectionEl = document.getElementById(trigger.dataset.toggleSection);
                if (!sectionEl) return;

                const isCollapsed = sectionEl.classList.contains('is-collapsed');
                const nextExpanded = isCollapsed;

                applySectionState(sectionEl, nextExpanded);
                safeSet('section-' + sectionEl.dataset.sectionKey, nextExpanded ? 'expanded' : 'collapsed');

                if (nextExpanded) {
                    requestAnimationFrame(() => {
                        initAllMasonry();
                    });
                }
            });
        }

        function initBackTop() {
            document.addEventListener('click', function (e) {
                const btn = e.target.closest('[data-back-top]');
                if (!btn) return;
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function initNavHighlight() {
            const navLinks = document.querySelectorAll('.topnav-link[data-nav-target]');
            if (navLinks.length === 0) return;

            const sections = Array.from(navLinks).map(link => {
                const id = link.dataset.navTarget;
                return { link, el: document.getElementById(id) };
            }).filter(s => s.el);

            function updateActive() {
                const scrollY = window.scrollY;
                const offset = 120;

                let current = null;
                sections.forEach(s => {
                    const top = s.el.offsetTop;
                    if (top - offset <= scrollY) {
                        current = s;
                    }
                });

                navLinks.forEach(link => link.classList.remove('is-active'));
                if (current) {
                    current.link.classList.add('is-active');
                }
            }

            let ticking = false;
            window.addEventListener('scroll', function () {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        updateActive();
                        ticking = false;
                    });
                    ticking = true;
                }
            });
            updateActive();
        }

        function applySearch(keyword) {
            const searchKeyword = keyword.trim().toLowerCase();
            const isSearching = searchKeyword.length > 0;
            const hintEl = document.getElementById('search-hint');
            const clearBtn = document.getElementById('search-clear');

            clearBtn.classList.toggle('is-visible', isSearching);

            document.getElementById('block-projects').classList.toggle('is-hidden', isSearching);

            // 全量重置
            document.querySelectorAll('.list-card, .tag-card, .month-card, .column-card').forEach(card => {
                card.classList.remove('is-hidden');
            });
            document.querySelectorAll('.article-item').forEach(item => {
                item.classList.remove('is-filtered');
            });
            document.querySelectorAll('.year-block').forEach(yb => {
                yb.classList.remove('is-empty');
            });
            document.querySelectorAll('.no-results').forEach(el => {
                el.classList.remove('is-visible');
            });
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.style.display = '';
            });

            // 非搜索状态
            if (!isSearching) {
                restoreCollapseState();
                hintEl.innerHTML = '';
                updateSectionsVisibility();
                requestAnimationFrame(() => initAllMasonry());
                return;
            }

            // 搜索状态：自动展开被收起的 section
            document.querySelectorAll('.section[data-section-key]').forEach(sectionEl => {
                if (sectionEl.classList.contains('is-collapsed')) {
                    applySectionState(sectionEl, true);
                }
            });

            // 搜索状态：自动展开被收起的大区块
            document.querySelectorAll('.block[data-block-key="articles"], .block[data-block-key="bilibili"]').forEach(blockEl => {
                if (blockEl.classList.contains('is-collapsed')) {
                    applyBlockState(blockEl, true);
                }
            });

            document.querySelectorAll('.article-item').forEach(item => {
                item.classList.remove('is-hidden');
            });

            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.style.display = 'none';
            });

            function getCatName(groupKey, item) {
                const meta = groupKey === 'articles' ? articleCategoryMeta : videoCategoryMeta;
                return (meta[item.category] && meta[item.category].name) || '';
            }

            const groups = [
                { key: 'articles', items: articles, meta: articleCategoryMeta, blockId: 'block-articles' },
                { key: 'bilibili', items: bilibiliVideos, meta: videoCategoryMeta, blockId: 'block-bilibili' }
            ];

            groups.forEach(g => {
                const blockEl = document.getElementById(g.blockId);
                if (!blockEl) return;

                const cards = blockEl.querySelectorAll('.list-card, .tag-card, .month-card, .column-card');

                cards.forEach(card => {
                    const itemsInCard = card.querySelectorAll('.article-item');
                    let matchedCount = 0;

                    itemsInCard.forEach(item => {
                        const iid = item.dataset.iid || '';
                        const content = g.items.find(a => makeItemId(g.key, a) === iid);
                        if (!content) {
                            item.classList.add('is-filtered');
                            return;
                        }
                        const catName = getCatName(g.key, content);
                        const haystack = [
                            content.title,
                            catName,
                            ...(content.tags || []),
                            ...(content.columns || [])
                        ].join(' ').toLowerCase();

                        if (haystack.indexOf(searchKeyword) !== -1) {
                            matchedCount++;
                        } else {
                            item.classList.add('is-filtered');
                        }
                    });

                    if (matchedCount === 0) {
                        card.classList.add('is-hidden');
                    }
                });

                blockEl.querySelectorAll('.year-block').forEach(yb => {
                    const visibleCards = yb.querySelectorAll('.month-card:not(.is-hidden)');
                    yb.classList.toggle('is-empty', visibleCards.length === 0);
                });

                const totalMatched = blockEl.querySelectorAll('.article-item:not(.is-filtered)').length;
                const noResultsEl = document.getElementById('no-results-' + g.key);
                if (noResultsEl) {
                    noResultsEl.classList.toggle('is-visible', totalMatched === 0);
                }
            });

            const totalMatched = document.querySelectorAll('.article-item:not(.is-filtered)').length;
            if (totalMatched === 0) {
                hintEl.innerHTML = '';
            } else {
                hintEl.innerHTML = `找到 <span class="keyword">${totalMatched}</span> 条相关内容`;
            }

            updateSectionsVisibility();
            requestAnimationFrame(() => initAllMasonry());
        }

        function restoreCollapseState() {
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.style.display = '';
                const cardId = btn.dataset.card;
                const expanded = btn.dataset.expanded === 'true';
                const safeCardId = (window.CSS && CSS.escape) ? CSS.escape(cardId) : cardId;
                const items = document.querySelectorAll(`.article-item[data-card="${safeCardId}"]`);

                items.forEach((item, index) => {
                    if (index < COLLAPSE_THRESHOLD) {
                        item.classList.remove('is-hidden');
                    } else {
                        if (expanded) {
                            item.classList.remove('is-hidden');
                        } else {
                            item.classList.add('is-hidden');
                        }
                    }
                });
            });
        }

        function updateSectionsVisibility() {
            const groups = ['articles', 'bilibili'];
            groups.forEach(g => {
                const catSection = document.getElementById('section-category-' + g);
                if (catSection) {
                    const visible = catSection.querySelectorAll('.list-card:not(.is-hidden)');
                    catSection.classList.toggle('is-empty', visible.length === 0);
                }
                const colSection = document.getElementById('section-column-' + g);
                if (colSection) {
                    const visible = colSection.querySelectorAll('.column-card:not(.is-hidden)');
                    colSection.classList.toggle('is-empty', visible.length === 0);
                }
                const tagSection = document.getElementById('section-tag-' + g);
                if (tagSection) {
                    const visible = tagSection.querySelectorAll('.tag-card:not(.is-hidden)');
                    tagSection.classList.toggle('is-empty', visible.length === 0);
                }
                const timelineSection = document.getElementById('section-timeline-' + g);
                if (timelineSection) {
                    const visible = timelineSection.querySelectorAll('.month-card:not(.is-hidden)');
                    timelineSection.classList.toggle('is-empty', visible.length === 0);
                }
            });
        }

        function initSearch() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('search-clear');
            let debounceTimer = null;

            input.addEventListener('input', function () {
                if (debounceTimer) clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    applySearch(input.value);
                }, 180);
            });

            clearBtn.addEventListener('click', function () {
                input.value = '';
                applySearch('');
                input.focus();
            });

            input.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    input.value = '';
                    applySearch('');
                }
            });
        }

        function initTheme() {
            const toggleBtn = document.getElementById('theme-toggle');
            const root = document.documentElement;

            function getPreferredTheme() {
                const saved = safeGet('theme');
                if (saved === 'dark' || saved === 'light') return saved;
                try {
                    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                } catch (e) {
                    return 'light';
                }
            }

            function applyTheme(theme) {
                if (theme === 'dark') {
                    root.classList.add('dark');
                    toggleBtn.textContent = '☀️';
                    toggleBtn.title = '切换到浅色模式';
                } else {
                    root.classList.remove('dark');
                    toggleBtn.textContent = '🌙';
                    toggleBtn.title = '切换到深色模式';
                }
            }

            applyTheme(getPreferredTheme());

            toggleBtn.addEventListener('click', function () {
                const isDark = root.classList.contains('dark');
                const next = isDark ? 'light' : 'dark';
                safeSet('theme', next);
                applyTheme(next);
                requestAnimationFrame(() => initAllMasonry());
            });

            try {
                const mq = window.matchMedia('(prefers-color-scheme: dark)');
                const handler = function (e) {
                    if (safeGet('theme')) return;
                    applyTheme(e.matches ? 'dark' : 'light');
                };
                if (mq.addEventListener) {
                    mq.addEventListener('change', handler);
                } else if (mq.addListener) {
                    mq.addListener(handler);
                }
            } catch (e) {
                // 忽略
            }
        }

        function renderAll() {
            renderProjects();
            renderContentBlock('articles', articles, articleCategoryMeta, document.getElementById('articles-body'));
            renderContentBlock('bilibili', bilibiliVideos, videoCategoryMeta, document.getElementById('bilibili-body'));
            renderCounts();
            requestAnimationFrame(() => {
                initAllMasonry();
            });
        }

        window.addEventListener('load', function () {
            renderAll();
            initBlockCollapse();
            initSectionCollapse();
            initToggle();
            initBackTop();
            initSearch();
            initTheme();
            initNavHighlight();
        });

        let resizeTimer = null;
        window.addEventListener('resize', function () {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(initAllMasonry, 150);
        });
    </script>
</body>
